services:
  product-api:
    build: ./backend
    command: uvicorn weaves.product.api.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://weaves:weaves@postgres:5432/weaves
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weaves
      POSTGRES_USER: weaves
      POSTGRES_PASSWORD: weaves
    ports:
      - "5432:5432"
    volumes:
      - weaves-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weaves -d weaves"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  weaves-postgres:
