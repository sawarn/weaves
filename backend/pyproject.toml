[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py39"
line-length = 88
exclude = ["weaves/static/app.js"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.9"
strict = true
ignore_missing_imports = true
files = ["weaves/product/contracts"]
