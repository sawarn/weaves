name: Backend CI and deployment

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/**"
      - "schemas/**"
      - "compose.yaml"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/**"
      - "schemas/**"
      - "compose.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  API_SERVICE: weaves-api
  WORKER_POOL: weaves-worker
  CLOUDSQL_INSTANCE: weaves-db

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: weaves_test
          POSTGRES_USER: weaves
          POSTGRES_PASSWORD: weaves
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weaves -d weaves_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      WEAVES_TEST_DATABASE_URL: postgresql://weaves:weaves@127.0.0.1:5432/weaves_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: ruff check .
      - run: mypy
      - run: docker build -t weaves-backend-ci .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Artifact Registry Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Deploy API and worker pool
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud run deploy "$API_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --port 8000 \
            --cpu 1 \
            --memory 1Gi \
            --max 3 \
            --concurrency 20 \
            --timeout 900 \
            --allow-unauthenticated \
            --service-account "weaves-api@${PROJECT_ID}.iam.gserviceaccount.com" \
            --add-cloudsql-instances "${PROJECT_ID}:${REGION}:${CLOUDSQL_INSTANCE}" \
            --set-secrets "DATABASE_URL=weaves-database-url:1,WEAVES_SECRET_ENCRYPTION_KEY=weaves-fernet-key:1" \
            --update-env-vars "^|^WEAVES_ALLOW_ORGANIZATION_ONBOARDING=false|CORS_ORIGINS=https://app.weave-studio.in"

          FRONTEND_URL="$(gcloud run services describe weaves-frontend \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)' 2>/dev/null || true)"
          if [ -n "$FRONTEND_URL" ]; then
            CORS_ORIGINS="https://app.weave-studio.in,$FRONTEND_URL"
            gcloud run services update "$API_SERVICE" \
              --project "$PROJECT_ID" --region "$REGION" \
              --update-env-vars "^|^CORS_ORIGINS=$CORS_ORIGINS"
          fi

          gcloud run worker-pools deploy "$WORKER_POOL" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --instances 1 \
            --cpu 1 \
            --memory 512Mi \
            --service-account "weaves-worker@${PROJECT_ID}.iam.gserviceaccount.com" \
            --command python \
            --args=-m,weaves.product.worker \
            --add-cloudsql-instances "${PROJECT_ID}:${REGION}:${CLOUDSQL_INSTANCE}" \
            --set-secrets "DATABASE_URL=weaves-database-url:1,WEAVES_SECRET_ENCRYPTION_KEY=weaves-fernet-key:1"

          API_URL="$(gcloud run services describe "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')"
          echo "API deployed at $API_URL"
      - name: Load deployment smoke credentials from Secret Manager
        run: |
          set -euo pipefail
          email="$(gcloud secrets versions access latest --secret=weaves-e2e-owner-email --project="$PROJECT_ID")"
          password="$(gcloud secrets versions access latest --secret=weaves-e2e-owner-password --project="$PROJECT_ID")"
          echo "::add-mask::$email"
          echo "::add-mask::$password"
          echo "WEAVES_E2E_EMAIL=$email" >> "$GITHUB_ENV"
          echo "WEAVES_E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "WEAVES_E2E_API_BASE=$(gcloud run services describe "$API_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')/api/v0" >> "$GITHUB_ENV"
      - name: Run deployed API end-to-end smoke
        run: python backend/scripts/e2e_smoke.py
